name: Verify public release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install constrained runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements.lock .
          python -m pip check

      - name: Verify source behavior
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src tests fixtures

      - name: Build deterministic public candidate
        run: python scripts/build_public_release.py --output "$RUNNER_TEMP/public-repo"

      - name: Verify candidate manifest and exclusions
        working-directory: ${{ runner.temp }}/public-repo
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          manifest = json.loads((root / "RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          records = manifest["files"]
          expected = {record["path"] for record in records}
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file() and path.name != "RELEASE_MANIFEST.json"
          }
          if actual != expected:
              raise SystemExit(f"Manifest scope mismatch: missing={expected-actual}, extra={actual-expected}")
          for record in records:
              path = root / record["path"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if path.stat().st_size != record["bytes"] or digest != record["sha256"]:
                  raise SystemExit(f"Manifest mismatch: {record['path']}")
          forbidden_exact = {".env", "docs/DEVPOST_SUBMISSION_DRAFT.md"}
          forbidden_prefixes = (".venv/", "artifacts/private/")
          for relative in actual:
              if relative in forbidden_exact or relative.startswith(forbidden_prefixes):
                  raise SystemExit(f"Forbidden release path: {relative}")
          print(f"verified {len(records)} manifest-hashed files")
          PY
          python -m unittest discover -s tests -v
          python -m compileall -q src tests fixtures

      - name: Build candidate container
        run: docker build -t dailies-guardian:ci "$RUNNER_TEMP/public-repo"

      - name: Smoke-test public container without live credentials
        run: |
          docker run -d --name dailies-guardian-ci \
            -p 127.0.0.1:18080:8080 \
            -e GOOGLE_CLOUD_PROJECT=ci-synthetic \
            -e GRAFANA_URL=https://grafana.invalid \
            -e GRAFANA_SERVICE_ACCOUNT_TOKEN=ci-placeholder-not-a-secret \
            dailies-guardian:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/tmp/healthz.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs dailies-guardian-ci
              exit 1
            fi
            sleep 1
          done
          test "$(docker exec dailies-guardian-ci id -u)" = "10001"
          grep -q '"status":"ok"' /tmp/healthz.json
          curl --fail --silent http://127.0.0.1:18080/ >/tmp/index.html
          grep -q 'Dailies Guardian' /tmp/index.html
          curl --fail --silent http://127.0.0.1:18080/api/fixture-cases >/tmp/fixture-cases.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/fixture-cases.json", encoding="utf-8"))
          assert data["fixture_id"] == "dailies-guardian-synthetic-v1"
          assert len(data["cases"]) == 3
          PY
          test -f /usr/share/licenses/mcp-grafana/LICENSE || \
            docker exec dailies-guardian-ci test -f /usr/share/licenses/mcp-grafana/LICENSE

      - name: Show container logs on failure
        if: failure()
        run: docker logs dailies-guardian-ci || true

      - name: Remove smoke container
        if: always()
        run: docker rm -f dailies-guardian-ci || true

      - name: Upload manifest only
        uses: actions/upload-artifact@v4
        with:
          name: public-release-manifest
          path: ${{ runner.temp }}/public-repo/RELEASE_MANIFEST.json
          if-no-files-found: error
          retention-days: 7
